<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propagation Lifecycle Dashboard - Ngapori Ranch</title>
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#07110b;--mute:#2f3f35;--line:#c5d0c8;--edge:#07110b;--acc:#0a5a28;--acci:#fff;--accs:#d3efdb;--warn:#7a3000;--warns:#ffe9c9;--warnb:#e27100;--bad:#a0001b;--bads:#ffd5db;--blue:#0b3f8f;--blues:#dbe8ff}
[data-theme=night]{--bg:#0a110d;--card:#141f18;--ink:#f6faf7;--mute:#c3d2c9;--line:#2e4137;--edge:#f6faf7;--acc:#63e590;--acci:#03200e;--accs:#173a25;--warn:#ffc37a;--warns:#3d2a0c;--warnb:#ff9d1f;--bad:#ff8b9b;--bads:#42121b;--blue:#9cc2ff;--blues:#12284a;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0}h3{font-size:15px;margin:14px 0 6px}p{margin:6px 0}
.k{color:var(--mute);font-size:14px}.sp{flex:1}.hidden{display:none!important}b{font-weight:700}
button,input,select{font:inherit;color:var(--ink)}
input,select{min-height:44px;padding:6px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--card);max-width:100%}
button{min-height:44px;padding:6px 14px;border:2px solid var(--edge);border-radius:10px;background:var(--acc);color:var(--acci);font-weight:700;cursor:pointer}
button.alt{background:var(--card);color:var(--ink)}button.sm{min-height:38px;padding:3px 10px;font-size:14px}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--edge);padding:10px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.brand small{display:block;font-size:13px;color:var(--mute);font-weight:400}
#status{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 14px;font-size:14px;background:var(--accs);border-bottom:2px solid var(--edge)}
#status.off{background:var(--warns);color:var(--warn)}#status.err{background:var(--bads);color:var(--bad)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--edge);display:inline-block}#status.off .dot,#status.err .dot{background:var(--warnb);border-radius:3px}
main{max-width:1180px;margin:0 auto;padding:14px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kp{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:10px 12px}.kp b{display:block;font-size:28px;line-height:1.1}.kp.hot{background:var(--warns);border-color:var(--warnb)}.kp.bad{background:var(--bads);border-color:var(--bad)}
#login{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}#login .card{width:min(360px,100%);display:grid;gap:12px;background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:16px}#login label{display:grid;gap:4px;font-weight:700}#login input{width:100%}.lerr{background:var(--bads);color:var(--bad);border:2px solid var(--bad);border-radius:10px;padding:8px 10px;font-weight:700}
section.card{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:12px 14px}
section.card>.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}.hd .ic{font-size:22px}.hd .n{font-weight:700;min-width:28px;text-align:center;border:2px solid var(--edge);border-radius:99px;padding:0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.it{border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.it .t{flex:1;min-width:200px}
.badge{display:inline-block;border:2px solid var(--edge);border-radius:99px;padding:0 9px;font-size:13px;font-weight:700;background:var(--card);white-space:nowrap}
.badge.ok{background:var(--accs)}.badge.wait{background:var(--warns);border-color:var(--warnb)}.badge.bad{background:var(--bads);border-color:var(--bad)}.badge.blue{background:var(--blues)}
.bar{display:flex;height:16px;border:2px solid var(--edge);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;border-right:1px solid var(--edge);background:var(--line)}.bar i.done{background:var(--acc)}.bar i.now{background:var(--warnb)}.bar i:last-child{border-right:0}
.lg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--mute)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{white-space:nowrap}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}.frm input[type=text]{flex:1;min-width:180px}
.note{background:var(--warns);color:var(--warn);border:2px solid var(--warnb);border-radius:10px;padding:8px 10px;margin:6px 0}
.ev{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
details>summary{cursor:pointer;font-weight:700;min-height:32px}
@media(max-width:560px){.ev{grid-template-columns:78px 1fr}.ev>:last-child{grid-column:2}}

#addact{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
#addact .card{width:min(440px,100%);display:grid;gap:10px;margin:0;max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);border:2px solid var(--edge,var(--line));border-radius:14px;padding:16px}
#addact h2{margin:0}#addact label{display:grid;gap:3px;font-weight:700}#addact label.chk{display:flex;gap:8px;align-items:center;font-weight:600}
#addact input[type=text],#addact textarea,#addact select{width:100%;font:inherit;padding:8px 10px;border:2px solid var(--edge,var(--line));border-radius:10px;background:var(--card);color:var(--ink)}
#addact textarea{resize:vertical;min-height:84px}#addact input[type=checkbox]{width:20px;height:20px}
#addact .aae{background:var(--bads,var(--warns));color:var(--bad);border:2px solid var(--bad);border-radius:10px;padding:8px 10px;font-weight:700}
#addact .arow{display:flex;gap:8px;flex-wrap:wrap}#addact details{display:grid;gap:8px}#addact summary{cursor:pointer;font-weight:700;min-height:32px}
</style></head><body>
<header>
  <div class="row">
    <div class="brand"><h1>Propagation Lifecycle Dashboard</h1><small>Ngapori Ranch · Bay 3 nursery</small></div>
    <span class="sp"></span>
    <div id="auth" class="row"></div>
    <button type="button" class="alt sm" data-a="theme" id="bTheme">Night</button>
  </div>
</header>
<div id="status"></div>
<main id="main"></main>
<div id="login" class="hidden" role="dialog" aria-modal="true" aria-labelledby="lgt"><div class="card">
<h2 id="lgt" style="margin:0">Manager sign in</h2>
<label>User name <input id="uid" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
<label>PIN <input id="upin" type="password" inputmode="numeric" autocomplete="current-password"></label>
<div id="lerr" class="lerr hidden" role="alert"></div>
<div class="row" style="margin:0"><button id="bIn" type="button" data-a="signin">Sign in</button><button type="button" class="alt" data-a="logincancel">Cancel</button></div></div></div>
<div id="addact" class="hidden" role="dialog" aria-modal="true" aria-labelledby="aat"><div class="card">
<h2 id="aat">Add activity</h2>
<label>Activity name <input id="aan" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Tray flipping"></label>
<label>Description <textarea id="aad" maxlength="300" placeholder="What the worker does, in a sentence or two"></textarea></label>
<p class="k" style="margin:0">The system fills in the ID, group, timing and scope, and adds it to every run.</p>
<details><summary>More options (optional)</summary>
<label>Group <select id="aap"><option value="">Automatic (Added activities)</option><option value="Phase 1: Pre-sowing and media preparation">Phase 1: Pre-sowing and media preparation</option><option value="Phase 2: Seeding and batching">Phase 2: Seeding and batching</option><option value="Phase 3: Germination and early emergence">Phase 3: Germination and early emergence</option><option value="Phase 4: Grow-out and crop maintenance">Phase 4: Grow-out and crop maintenance</option><option value="Phase 5: Hardening off and pre-delivery">Phase 5: Hardening off and pre-delivery</option><option value="Phase 6: Fulfillment and delivery">Phase 6: Fulfillment and delivery</option></select></label>
<label class="chk"><input type="checkbox" id="aac"> Workers record a quantity when they finish</label>
</details>
<div id="aae" class="aae hidden" role="alert"></div>
<div class="arow"><button id="aago" type="button">Add activity</button><button id="aax" type="button" class="alt">Cancel</button></div>
</div></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- config + helpers ---------- */
const API_URL = "https://script.google.com/macros/s/AKfycbz7qyhFT5BRUpiqLCnjtT8gRX-UQ-I0lQhF__H6dgCU_Rql2WFOMuNm-YLXazi0Zrir_g/exec";
const POLL_MS = 60000, IDLE_MS = 0,   /* 0 = never sign out for inactivity (the server still ends a session after 16 hours). For production set e.g. 30 * 60000. */  SCOUT = ["ACT-303", "ACT-403"], HORIZON = 30;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { v === null || v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const todayStr = () => ymd(new Date());
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const add = (s, n) => ymd(new Date(Date.parse(s) + n * 864e5 + new Date().getTimezoneOffset() * 6e4));
const fmt = s => { const d = new Date(String(s).slice(0, 10) + "T00:00:00"); return isNaN(d) ? esc(s) : d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}); };
const fmtS = s => { const d = new Date(String(s).slice(0, 10) + "T00:00:00"); return isNaN(d) ? esc(s) : d.toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
const when = s => { if (!s) return "—"; const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s); return isNaN(d) ? esc(s) : d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); };
const clock = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); };
const ago = (iso, now) => { const m = Math.max(0, Math.round(((now || Date.now()) - Date.parse(iso)) / 60000)); return m < 90 ? m + " min" : Math.round(m / 60) + " h"; };
const pf = p => p === "F" ? "Field" : p === "G" ? "Greenhouse" : p;
const KIND = {DIRECT_CLOSE:"Direct close", GATE_OVERRIDE:"Gate override", LEAF_OVERRIDE:"First-leaf override", ALERT_RESOLVED:"Alert resolved", ASSIGN:"Assigned", REASSIGN:"Reassigned", UNASSIGN:"Removed"};

/* ---------- state + network ---------- */
let M = LS.get("pd_session"), D = null, SNAP = null, MODE = "live", FORCED = false, ERR = "", SYNCING = false, OFFSET = 0, LAST = Date.now(), NEED = false, ASKED = false;   // NEED: the server wants a manager sign-in before it sends data
const DRAFT = {};
const hdr = {"Content-Type":"text/plain;charset=utf-8"};
async function call(url, opt) {
  let t; try { t = await (await fetch(url, opt)).text(); } catch (e) { throw new Error("No connection to the server."); }
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error("The server sent back a web page instead of data. Check the URL ends in /exec and the latest Code_pro.gs is deployed as a new version."); }
  if (j.error) { if (/^AUTH:/.test(j.error) && M) signOut("Manager session ended. Sign in again."); throw new Error(j.error.replace(/^AUTH:\s*/, "")); }
  return j;
}
const post = b => call(API_URL, {method:"POST", headers:hdr, body:JSON.stringify({...b, token: M ? M.token : undefined})});
const nowMs = () => MODE === "live" ? Date.now() + OFFSET : (D ? D.now : Date.now());
const MGR = /^(manager|founder)$/i;
const isMgr = () => !!M && MODE === "live";   // only Manager/Founder accounts can sign in here (boardLogin), and the server re-checks every write

async function load(quiet) {
  if (MODE === "offline" && FORCED) return;
  SYNCING = true; status();
  try {
    const d = await call(API_URL + "?" + new URLSearchParams(M ? {action:"monitor", token:M.token} : {action:"monitor"}));
    NEED = false; ASKED = false; D = d; OFFSET = d.now - Date.now(); MODE = "live"; SNAP = new Date().toISOString(); ERR = ""; LS.set("pd_snap", {saved:SNAP, data:D});
  } catch (e) {
    if (/sign.?in required|^AUTH|not signed in|session (ended|expired)|invalid token/i.test(e.message)) {   // data is behind the manager sign-in: ask for it instead of showing an error
      if (M) { M = null; LS.set("pd_session", null); }
      NEED = true; D = null; SNAP = null; ERR = ""; SYNCING = false; MODE = "live"; FORCED = false; authBar();   // the server answered, so we are online: signing in must be allowed
      if (!ASKED) { ASKED = true; openLogin(); }
      render(); return;
    }
    ERR = /Unknown action/.test(e.message) ? "The server has no dashboard feed yet. Deploy the latest Code_pro.gs as a new version." : e.message;
    if (!D) { const s = LS.get("pd_snap"); if (s && s.data) { D = s.data; SNAP = s.saved; } }
    if (D) MODE = "offline";
    if (!quiet) toast(ERR, true);
  } finally { SYNCING = false; }
  render();
}
function status() {
  const el = $("status"), age = SNAP ? Math.round((Date.now() - Date.parse(SNAP)) / 60000) : 0;
  if (SYNCING) { el.className = ""; el.innerHTML = `<span class="dot"></span><b>Syncing…</b>`; return; }
  const btns = `<button class="alt sm" type="button" data-a="refresh" aria-label="Refresh now">↻ Refresh</button>`;
  if (NEED && !D) { el.className = "err"; el.innerHTML = `<span class="dot"></span><b>Signed out</b><span>Sign in to load the dashboard.</span><span class="sp"></span>${btns}`; return; }
  if (MODE === "live") { el.className = ""; el.innerHTML = `<span class="dot"></span><b>Live</b><span>synced ${esc(clock(SNAP))}</span><span class="sp"></span><span>${new Date().toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"})}</span>${btns}<button class="alt sm" type="button" data-a="offline">Use snapshot instead</button>`; return; }
  el.className = ERR ? "err" : "off";
  el.innerHTML = `<span class="dot"></span><b>${D ? "Snapshot" : "Not connected"}</b><span>${SNAP ? "saved " + esc(clock(SNAP)) + " · " + age + " min old · read-only" : esc(ERR || "")}</span>${ERR ? `<span>${esc(ERR)}</span>` : ""}<span class="sp"></span>${btns}${FORCED ? `<button class="alt sm" type="button" data-a="live">Go live</button>` : ""}`;
}
function toast(m, bad) { const el = $("toast"); el.textContent = m; el.classList.remove("hidden"); el.style.background = bad ? "var(--bad)" : ""; el.style.color = bad ? "#fff" : ""; clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), bad ? 7000 : 2800); }
async function write(label, fn) { toast(label + "…"); document.body.style.cursor = "progress"; try { return await fn(); } catch (e) { toast(e.message, true); return null; } finally { document.body.style.cursor = ""; } }

/* ---------- sign-in ---------- */
function authBar() {
  $("auth").innerHTML = M
    ? `<span><b>${esc(M.name)}</b> <span class="k">${esc(M.role)}</span></span>${MODE === "live" ? `<button class="sm" type="button" data-addact>+ Add activity</button>` : ""}<button class="alt sm" type="button" data-a="signout">Sign out</button>`
    : `<button type="button" class="sm" data-a="login">Manager sign in</button>`;
  $("bTheme").textContent = document.documentElement.dataset.theme === "night" ? "Sun" : "Night";
}
function loginErr(m) { const el = $("lerr"); el.textContent = m || ""; el.classList.toggle("hidden", !m); }
function openLogin() { $("uid").value = ""; $("upin").value = ""; loginErr(""); $("login").classList.remove("hidden"); setTimeout(() => $("uid").focus(), 0); }
function closeLogin() { $("login").classList.add("hidden"); $("upin").value = ""; }
async function signIn() {
  const u = $("uid").value.trim(), p = $("upin").value; if (!u || !p) return loginErr("Enter your user name and PIN.");
  if (MODE !== "live") { if (FORCED) return loginErr("Tap Go live first: you chose the saved snapshot."); MODE = "live"; }   // not forced: just try the server
  const b = $("bIn"); b.disabled = true; b.textContent = "Signing in…"; loginErr("");
  try { const r = await post({action:"boardLogin", user:u, pin:p, device:navigator.userAgent});
    M = {token:r.token, name:r.user.name, role:r.user.role, id:r.user.workerId}; LS.set("pd_session", M); LAST = Date.now(); closeLogin(); NEED = false; authBar(); render(); toast("Signed in: " + M.name); load(true); }
  catch (e) { loginErr(e.message); $("upin").value = ""; $("upin").focus(); }
  finally { b.disabled = false; b.textContent = "Sign in"; }
}
function signOut(msg) {
  const t = M && M.token; M = null; LS.set("pd_session", null);
  if (t) { try { fetch(API_URL, {method:"POST", headers:hdr, body:JSON.stringify({action:"logout", token:t})}).catch(() => {}); } catch (e) {} }
  authBar(); render(); if (msg) toast(msg); load(true);   // reading may need the sign-in too: this shows the sign-in prompt if so
}

/* ---------- derived data ---------- */
const runs = () => D ? D.runs.filter(r => !r.error) : [];
const gateOk = g => (g.completed && g.verified) || g.overridden;
const leafOk = w => !!w.leaf && (w.leaf.outcome === "PASS" || w.leaf.outcome === "OVERRIDDEN");
const nursery = w => (w.phases || []).find(p => p.phase === "Nursery" && p.days > 0);
const openAlerts = () => D ? D.alerts.filter(a => a.status === "OPEN") : [];
const flat = () => runs().flatMap(r => r.waves.map(w => ({r, w})));
const pendingGates = () => ((D && D.unverified) || []).filter(x => x.done && x.scope !== "crop-wave").map(x => ({r: runs().find(r => r.runId === x.runId), g: {id: x.activityId, name: x.activity, completedBy: x.completedBy, logId: x.logId || ""}})).filter(x => x.r);   // one row per worker portion (or direct close) waiting for a manager
function blocking() {   // an upcoming or overdue sow whose pre-sowing gates are not all cleared
  const t = todayStr(), o = [];
  runs().forEach(r => { if (r.direct) return; const pre = (r.gates || []).filter(g => g.scope === "pre-sowing"), left = pre.filter(g => !gateOk(g));
    if (!left.length) return;
    const w = r.waves.filter(x => x.trays > 0 && t < x.plant).sort((a, b) => a.sow < b.sow ? -1 : 1)[0];
    if (w && days(t, w.sow) <= 14) o.push({r, w, left, d: days(t, w.sow)}); });
  return o.sort((a, b) => a.d - b.d);
}
function active() { const t = todayStr(); return flat().filter(({r, w}) => w.trays > 0 && w.init && t >= w.sow && t < w.plant); }
function events() {
  const t = todayStr(), end = add(t, HORIZON), o = [];
  flat().forEach(({r, w}) => {
    if (!(w.trays > 0) || t > w.plant) return;
    const nm = r.cropName + " W" + w.wave, base = {n:nm, run:r.runId, sel:r.runId};
    if (w.sow >= t) o.push({...base, date:w.sow, t:"Propagation start", flag: w.init ? "" : "Not initiated"});
    (w.phases || []).forEach(p => { if (p.days > 0 && p.end >= t && p.end <= end && p.end < w.plant && t >= w.sow) o.push({...base, date:p.end, t:p.phase + " ends", flag:""}); });
    const ph = nursery(w); if (ph && !leafOk(w) && ph.start >= t) o.push({...base, date:ph.start, t:"First-leaf check due", flag:""});
    if (ph && !leafOk(w) && ph.start < t && w.init && t >= w.sow) o.push({...base, date:t, t:"First-leaf check due", flag: w.leaf && w.leaf.outcome === "FAIL" ? "Failed" : "Not recorded"});
    o.push({...base, date:w.plant, t:"Transplant due (DOB)", flag:""});
  });
  return o.filter(e => e.date <= end).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).slice(0, 40);
}

/* ---------- sections ---------- */
const sec = (ic, title, sub, n, body, id) => `<section class="card" ${id ? `id="${id}"` : ""}><div class="hd"><span class="ic" aria-hidden="true">${ic}</span><div><h2>${title}</h2><span class="k">${sub}</span></div><span class="sp"></span>${n === "" ? "" : `<span class="n">${n}</span>`}</div>${body}</section>`;
function kpis() {
  const rs = runs(), gt = rs.reduce((n, r) => n + (r.acts ? r.acts.gates : 0), 0), go = rs.reduce((n, r) => n + (r.acts ? r.acts.gatesOk : 0), 0);
  const pend = pendingGates().length, al = openAlerts().length, act = active(), tr = act.reduce((n, x) => n + x.w.trays, 0);
  const k = (big, lab, cls) => `<div class="kp ${cls || ""}"><b>${big}</b>${lab}</div>`;
  return `<div class="kpis">${k(`${go} <span class="k">of ${gt}</span>`, "Stage gates cleared")}${k(pend, "Pending verification", pend ? "hot" : "")}${k(al, "Open stall alerts", al ? "bad" : "")}${k(act.length, `Waves in propagation · ${tr} trays`)}</div>`;
}
function secPending() {
  const p = pendingGates(), b = blocking(), mg = isMgr();
  const row = ({r, g}) => `<div class="it"><span class="t"><b>${esc(r.cropName)}</b> · ${esc(r.runId)}<br><span class="k">${esc(g.id)} ${esc(g.name)}${g.completedBy ? " · done by " + esc(g.completedBy) : ""}</span></span><button type="button" class="sm" data-a="verify" data-run="${esc(r.runId)}" data-id="${esc(g.id)}" data-log="${esc(g.logId)}" ${mg ? "" : "disabled"}>Verify</button></div>`;
  const brow = x => `<div class="it"><span class="t"><b>${esc(x.r.cropName)} W${x.w.wave}</b> · ${esc(x.r.runId)}<br><span class="k">${x.d < 0 ? "Sow date passed " + (-x.d) + " d ago" : x.d === 0 ? "Sow today" : "Sow in " + x.d + " d (" + fmtS(x.w.sow) + ")"} · ${esc(x.r.propLocation || "")}</span></span><span class="badge ${x.d <= 0 ? "bad" : "wait"}">${x.left.length} of ${x.r.gates.filter(g => g.scope === "pre-sowing").length} gates open</span></div>`;
  const opts = p.map(({r, g}) => `<option value="${esc(r.runId)}|${esc(g.id)}|${esc(g.logId)}">${esc(r.cropName)} · ${esc(r.runId)} · ${esc(g.id)} ${esc(g.name)}${g.completedBy ? " · " + esc(g.completedBy) : ""}</option>`).join("");
  const body = `${mg ? "" : `<div class="note">View only. Sign in as a manager to verify.</div>`}
    <h3>Gate steps done, awaiting verification (${p.length})</h3>${p.length ? `<div class="g">${p.map(row).join("")}</div>` : `<p class="k">None. A worker portion appears here once it is submitted; each one is verified on its own.</p>`}
    <h3>Benches blocking an upcoming sow (${b.length}) · pre-sowing gates not cleared</h3>${b.length ? `<div class="g">${b.map(brow).join("")}</div>` : `<p class="k">No sow in the next 14 days is waiting on a bench gate.</p>`}
    <h3>Verify a done step by ID</h3><div class="frm"><select id="vsel" aria-label="Step to verify" ${p.length ? "" : "disabled"}>${opts || `<option>No steps awaiting verification</option>`}</select><input type="text" id="vnote" data-d="vnote" value="${esc(DRAFT.vnote || "")}" placeholder="Verification notes (optional)" aria-label="Verification notes"><button type="button" data-a="verifysel" ${mg && p.length ? "" : "disabled"}>Verify ready</button></div>
    <p class="k">Initiate waves, assign work and override gates in the Propagation Manager console.</p>`;
  return sec("📑", "Pending Verification", "Gate steps · benches to release", p.length, body);
}
function phaseBar(w, t) {
  const ph = (w.phases || []).filter(p => p.days > 0), tot = ph.reduce((n, p) => n + p.days, 0) || 1;
  return `<div class="bar" role="img" aria-label="Propagation phases">${ph.map(p => `<i style="flex:${p.days}" class="${t >= p.end ? "done" : t >= p.start ? "now" : ""}" title="${esc(p.phase)} ${fmtS(p.start)} to ${fmtS(p.end)}"></i>`).join("")}</div><div class="lg">${ph.map(p => `<span>${t >= p.start && t < p.end ? "<b>▶ " + esc(p.phase) + "</b>" : esc(p.phase)} ${p.days} d</span>`).join("")}</div>`;
}
function secActive() {
  const t = todayStr(), a = active().sort((x, y) => x.w.plant < y.w.plant ? -1 : 1);
  const card = ({r, w}) => { const ph = (w.phases || []).find(p => p.start <= t && t < p.end), left = days(t, w.plant), o = w.leaf ? w.leaf.outcome : "";
    const lf = r.direct ? "" : o === "PASS" ? `<span class="badge ok">✓ First leaf pass</span>` : o === "OVERRIDDEN" ? `<span class="badge wait">! First leaf overridden</span>` : o === "FAIL" ? `<span class="badge bad">✕ First leaf fail</span>` : `<span class="badge">○ First leaf pending</span>`;
    return `<div class="it" style="display:block"><div class="row"><b>${esc(r.cropName)} W${w.wave}</b><span class="k">${esc(r.runId)} · ${pf(r.platform)}</span><span class="sp"></span>${lf}</div>
      ${phaseBar(w, t)}<div class="k">${ph ? "In <b>" + esc(ph.phase) + "</b>, day " + (days(ph.start, t) + 1) + " of " + ph.days + " · " : ""}${w.trays} trays · transplant ${left <= 0 ? "due today" : "in " + left + " d"} (${fmtS(w.plant)}) → ${esc(r.location)}${r.bed ? " · bed " + esc(r.bed) : ""}</div></div>`; };
  return sec("🌱", "Active Lifecycle Cards", "Initiated waves in the room · DOB-anchored", a.length,
    a.length ? `<div class="g">${a.map(card).join("")}</div>` : `<p class="k">🌱 No wave is in propagation today. A card appears once a wave is initiated and its sow date has arrived.</p>`);
}
function secCalendar() {
  const ev = events();
  return sec("📅", "Upcoming Calendar Schedule", `Next ${HORIZON} days · sow, phase changes, first-leaf checks, transplant`, ev.length,
    ev.length ? ev.map(e => { const d = days(todayStr(), e.date);
      return `<div class="ev"><span class="badge ${d <= 0 ? "wait" : "blue"}">${d <= 0 ? "Today" : fmtS(e.date)}</span><span><b>${esc(e.t)}</b> · ${esc(e.n)}<br><span class="k">${esc(e.run)} · ${fmt(e.date)}${d > 0 ? " · in " + d + " d" : ""}</span></span>${e.flag ? `<span class="badge ${e.flag === "Failed" ? "bad" : "wait"}">${esc(e.flag)}</span>` : "<span></span>"}</div>`; }).join("")
      : `<p class="k">Nothing scheduled in the next ${HORIZON} days.</p>`);
}
function secWatch() {
  const sc = D.tasks.filter(t => SCOUT.includes(t.activityId)), open = sc.filter(t => !t.done);
  const fl = flat().filter(({r, w}) => w.trays > 0 && w.init && !r.direct && !leafOk(w) && nursery(w) && todayStr() >= nursery(w).start && todayStr() < w.plant);
  const body = `<p class="k">Scouting activities: Sprout scouting (ACT-303) and Pest scouting (ACT-403). Cadence: every 7 days during growth.</p>
    ${sc.length ? `<div class="tw"><table><tr><th>Run</th><th>Activity</th><th>Team</th><th>Status</th><th>Due</th></tr>${sc.map(t => `<tr><td>${esc(t.crop)} · ${esc(t.runId)}</td><td>${esc(t.activityId)} ${esc(t.activity)}</td><td>${esc(t.team.join(", "))}</td><td><span class="badge ${t.done ? "ok" : "wait"}">${t.done ? "✓ Done" : "○ Open"}</span></td><td>${t.due ? fmt(t.due) : "—"}</td></tr>`).join("")}</table></div>` : `<p class="k">🛡 No scouting activity is assigned to any run yet.</p>`}
    ${fl.length ? `<h3>First-leaf checks due or overdue</h3>${fl.map(({r, w}) => `<div class="it"><span class="t"><b>${esc(r.cropName)} W${w.wave}</b> · ${esc(r.runId)}</span><span class="badge ${w.leaf && w.leaf.outcome === "FAIL" ? "bad" : "wait"}">${w.leaf && w.leaf.outcome === "FAIL" ? "✕ Failed, needs a decision" : "Not recorded"}</span></div>`).join("")}` : ""}`;
  return sec("🛡", "Crop Watchguard", "Routine scouting feed", open.length, body);
}
function secWorkers() {
  const now = nowMs(), rows = [];
  D.sessions.forEach(s => rows.push({n:s.by || "(unknown)", where:(s.crop || "") + " W" + s.wave + " · " + s.runId, act:s.activity, st:s.pausedAt ? "Paused: " + (s.pauseReason || "no reason") : "Working", cls:s.pausedAt ? (/stall/i.test(s.pauseReason) ? "bad" : "wait") : "ok", at:s.pausedAt || s.startedAt, loc:s.location}));
  D.tasks.filter(t => !t.done).forEach(t => t.team.forEach(n => { if (!rows.some(r => r.n === n && r.act === t.activity && r.where.endsWith(t.runId))) rows.push({n, where:(t.cropCode || t.crop) + " · " + t.runId, act:t.activity, st:"Assigned", cls:"", at:"", loc:t.loc}); }));
  rows.sort((a, b) => a.n.localeCompare(b.n));
  return sec("👷", "Worker Location Board", "Live sessions and open assignments", rows.length,
    rows.length ? `<div class="tw"><table><tr><th>Worker</th><th>Run</th><th>Activity</th><th>Location</th><th>Status</th><th>Last activity</th></tr>${rows.map(r => `<tr><td><b>${esc(r.n)}</b></td><td>${esc(r.where)}</td><td>${esc(r.act)}</td><td>${esc(r.loc)}</td><td><span class="badge ${r.cls}">${esc(r.st)}</span></td><td>${r.at ? esc(ago(r.at, now)) + " ago" : "—"}</td></tr>`).join("")}</table></div>` : `<p class="k">Nobody is working or assigned right now.</p>`);
}
function secExceptions() {
  const o = openAlerts(), done = D.alerts.filter(a => a.status === "RESOLVED").slice(-6).reverse(), now = nowMs(), mg = isMgr();
  const row = a => `<div class="it" style="display:block"><b>${esc(a.reason)}</b> · ${esc(a.worker_name)}<br><span class="k">${esc(a.activity_name)} · ${esc(a.crop_code)} · ${esc(a.location)} · open ${esc(ago(a.created_at, now))}${a.note ? " · “" + esc(a.note) + "”" : ""}</span>
    <div class="frm"><input type="text" data-d="ra|${esc(a.alert_id)}" value="${esc(DRAFT["ra|" + a.alert_id] || "")}" placeholder="What was done (required)" aria-label="Resolution note"><button type="button" class="sm" data-a="resolve" data-id="${esc(a.alert_id)}" ${mg ? "" : "disabled"}>Resolve</button></div></div>`;
  return sec("⚠", "Exception Overrides", "Open stall alerts · manager resolves with a note", o.length,
    (o.length ? `<div class="g">${o.map(row).join("")}</div>` : `<p class="k">✅ No open exceptions.</p>`) + (mg || !o.length ? "" : `<div class="note">Sign in as a manager to resolve.</div>`) +
    (done.length ? `<details><summary>Recently resolved (${done.length})</summary>${done.map(a => `<div class="k" style="padding:3px 0">${when(a.resolved_at)} · ${esc(a.worker_name)} · ${esc(a.activity_name)} · ${esc(a.reason)}${a.stall_min !== "" && a.stall_min != null ? " · " + esc(a.stall_min) + " min" : ""}${a.resolution ? " · " + esc(a.resolution) : ""}</div>`).join("")}</details>` : ""));
}
function secLog() {
  const a = D.assignLog.slice(0, 15), m = D.mgrLog.slice(0, 10);
  return sec("🔄", "Recent Reassignments", "Manager-initiated handoffs and actions", a.length || "",
    (a.length ? `<div class="tw"><table><tr><th>When</th><th>Change</th><th>Run · activity</th><th>From</th><th>To</th><th>By</th></tr>${a.map(x => `<tr><td>${when(x.ts)}</td><td>${esc(KIND[x.kind] || x.kind)}</td><td>${esc(x.run_id)} · ${esc(x.activity_id)}</td><td>${esc(x.from_name)}</td><td>${esc(x.to_name)}</td><td>${esc(x.by)}</td></tr>`).join("")}</table></div>` : `<p class="k">No reassignments logged.</p>`) +
    (m.length ? `<details><summary>Manager actions (${m.length})</summary><div class="tw"><table><tr><th>When</th><th>Action</th><th>Where</th><th>Reason</th><th>By</th></tr>${m.map(x => `<tr><td>${when(x.ts)}</td><td>${esc(KIND[x.kind] || x.kind)}</td><td>${esc(x.run_id)}${x.wave ? " W" + esc(x.wave) : ""}${x.activity_id ? " · " + esc(x.activity_id) : ""}</td><td>${esc(x.reason)}</td><td>${esc(x.by)}</td></tr>`).join("")}</table></div></details>` : ""));
}
function render() {
  authBar(); status();
  const m = $("main");
  if (!D && NEED) { m.innerHTML = `<div class="note" style="display:grid;gap:8px;justify-items:start"><b>Sign in to see the dashboard</b><span>Ranch data is shown to managers and founders only. Use your user name and PIN.</span><button type="button" data-a="login">Manager sign in</button></div>`; return; }
  if (!D) { m.innerHTML = `<div class="note">${esc(ERR || "Connecting…")}</div>`; return; }
  const ae = document.activeElement; if (ae && m.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;   // do not wipe what someone is typing
  const open = new Set([...m.querySelectorAll("details[open]")].map(d => d.querySelector("summary").textContent));
  m.innerHTML = kpis() + secPending() + secActive() + secCalendar() + secWatch() + secWorkers() + secExceptions() + secLog() + `<p class="k">Source: live Apps Script connection. Reading is open; verifying and resolving need a manager sign-in and are recorded under your name. <span title="If this line is missing you are looking at an older copy of the file">Build: sign-in v3.</span></p>`;
  m.querySelectorAll("details").forEach(d => { if (open.has(d.querySelector("summary").textContent)) d.open = true; });
}

/* ---------- actions ---------- */
function gate() {
  if (MODE !== "live") { toast("Snapshot is read-only. Go live first.", true); return false; }
  if (!M) { toast("Sign in as a manager to do that.", true); const u = $("uid"); if (u) u.focus(); return false; }
  return true;
}
async function doVerify(run, id, notes, log) {
  if (!confirm(`Verify ${id} on run ${run} as ready?\n\nThis is recorded under ${M.name}.`)) return;
  const r = await write("Verifying " + id, () => post(log ? {action:"verifyWork", runId:run, activityId:id, logId:log, notes:notes || ""} : {action:"verify", runId:run, activityId:id, notes:notes || ""})); if (r) { delete DRAFT.vnote; toast("Verified " + id); } load(true);
}
async function doResolve(id) {
  const note = (DRAFT["ra|" + id] || "").trim(); if (!note) return toast("Type what was done first. It is required and is logged.", true);
  const r = await write("Resolving alert", () => post({action:"resolveAlert", alertId:id, note})); if (r) { delete DRAFT["ra|" + id]; toast("Alert resolved"); } load(true);
}
document.addEventListener("click", e => {
  LAST = Date.now(); const b = e.target.closest("[data-a]"); if (!b) return; const d = b.dataset;
  switch (d.a) {
    case "theme": { const n = document.documentElement.dataset.theme === "night" ? "sun" : "night"; document.documentElement.dataset.theme = n; LS.set("pd_theme", n); authBar(); break; }
    case "login": openLogin(); break; case "logincancel": closeLogin(); break; case "signin": signIn(); break; case "signout": signOut("Signed out"); break;
    case "refresh": FORCED = false; MODE = "live"; load(); break;
    case "offline": if (!D) return toast("No snapshot saved on this device yet.", true); MODE = "offline"; FORCED = true; render(); break;
    case "live": FORCED = false; MODE = "live"; load(); break;
    case "verify": if (gate()) doVerify(d.run, d.id, "", d.log); break;
    case "verifysel": if (gate()) { const v = ($("vsel").value || "").split("|"); if (v.length >= 2) doVerify(v[0], v[1], (DRAFT.vnote || "").trim(), v[2] || ""); } break;
    case "resolve": if (gate()) doResolve(d.id); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "upin" || e.target.id === "uid")) signIn(); if (e.key === "Escape" && !$("login").classList.contains("hidden")) closeLogin(); });
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.d; if (k) DRAFT[k] = e.target.value; });
["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { LAST = Date.now(); }, {passive:true}));

/* ---------- add activity (manager): the server assigns ID, group, timing, scope ---------- */
function addActErr(m) { const el = $("aae"); el.textContent = m || ""; el.classList.toggle("hidden", !m); }
function openAddAct() { $("aan").value = ""; $("aad").value = ""; $("aap").value = ""; $("aac").checked = false; addActErr(""); $("addact").classList.remove("hidden"); setTimeout(() => $("aan").focus(), 0); }
function closeAddAct() { $("addact").classList.add("hidden"); }
async function submitAddAct() {
  const name = $("aan").value.trim().replace(/\s+/g, " "), description = $("aad").value.trim();
  if (!name) { addActErr("Type the activity name."); $("aan").focus(); return; }
  if (!description) { addActErr("Add a short description of the work."); $("aad").focus(); return; }
  const go = $("aago"); go.disabled = true; addActErr("");
  try {
    const r = await post({action:"addActivity", name, description, phase:$("aap").value, requiresCount:$("aac").checked});
    closeAddAct(); toast("Added " + r.activity.id + " · " + r.activity.name + (r.runsUpdated ? " to " + r.runsUpdated + " runs" : ""));
    await ADDACT_REFRESH();
  } catch (e) { addActErr(/Unknown action/i.test(e.message) ? "The server does not know this feature yet. Deploy the latest Code_pro.gs (with addActivity) as a new version." : e.message); }
  finally { go.disabled = false; }
}
$("aago").onclick = submitAddAct; $("aax").onclick = closeAddAct;
$("addact").addEventListener("click", e => { if (e.target === $("addact")) closeAddAct(); });
$("aan").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("aad").focus(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("addact").classList.contains("hidden")) closeAddAct(); });
document.addEventListener("click", e => { if (e.target.closest("[data-addact]")) openAddAct(); });
const ADDACT_REFRESH = () => load(true);
document.documentElement.dataset.theme = LS.get("pd_theme") === "night" ? "night" : "sun";
setInterval(() => { if (!document.hidden && !(MODE === "offline" && FORCED)) load(true); }, POLL_MS);
setInterval(() => { if (M && IDLE_MS > 0 && Date.now() - LAST > IDLE_MS) signOut("Manager sign-in ended after 15 minutes without use."); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !(MODE === "offline" && FORCED) && Date.now() - Date.parse(SNAP || 0) > 30000) load(true); });
authBar(); load();
</script></body></html>
